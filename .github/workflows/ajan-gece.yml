# MAG Pazar — 🤖 Otonom ajanlar (v16)
#  GitHub bu görevi HER SAAT uyandırır; ajanlar sadece programda seçtiğin gün ve saatlerde iş yapar
#  (Ofis → ⏰ Saatler ve görevler). Diğer saatlerde 1 dakikadan kısa sürede "mesai dışı" deyip kapanır.
#  Günün ilk mesai saatinde "sabah" görevleri, her mesai saatinde "her çalışmada" görevleri yapılır.
#  Programdaki "▶ Şimdi çalıştır" saat ne olursa olsun çalıştırır.
# Ücretsiz (herkese açık depoda GitHub Actions ücretsizdir). Ayrıntı: README.md → "Gece ajanı".
name: Ajan sabah raporu

on:
  schedule:
    - cron: "17 * * * *"    # her saatin 17. dakikası (Türkiye saatiyle de :17)
  workflow_dispatch:
    inputs:
      zamanli:
        description: "1 = dış zamanlayıcıdan otomatik tur (mesai saatlerine uyar)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: ajan-gece
  cancel-in-progress: false

jobs:
  rapor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Europe/Istanbul
    steps:
      - uses: actions/checkout@v4
      # GitHub, 60 gün hiç değişiklik olmayan depoda zamanlayıcıyı kapatır. 50 günü geçince boş bir kayıt atıp açık tutar.
      - name: Zamanlayıcıyı açık tut
        if: github.event_name == 'schedule'
        run: |
          son=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - son )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "mag-ajan"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "ajan: zamanlayıcıyı açık tut" && git push || true
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Paketleri kur (bildirim + Gmail)
        run: npm install --no-save --no-audit --no-fund web-push@3 nodemailer imapflow mailparser
      - name: Ajanları çalıştır
        run: node ajan-gece.mjs
        env:
          ZAMANLI: ${{ github.event.inputs.zamanli }}
          FB_EMAIL: ${{ secrets.FB_EMAIL }}
          FB_PASSWORD: ${{ secrets.FB_PASSWORD }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
